name: Backup and Rollback

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'backup'
        type: choice
        options:
        - backup
        - rollback

jobs:
  backup-rollback:
    runs-on: ubuntu-latest
    
    steps:
    - name: Backup or Rollback
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          PROJECT_PATH="/home/${{ secrets.SERVER_USER }}/captcha-generator"
          BACKUP_PATH="/home/${{ secrets.SERVER_USER }}/backups"
          
          if [ "${{ github.event.inputs.action }}" == "backup" ]; then
            echo "💾 Creating backup..."
            mkdir -p $BACKUP_PATH
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            
            # Backup database
            docker compose exec -T db pg_dump -U ${{ secrets.DB_USER_PROD }} ${{ secrets.DB_NAME_PROD }} > $BACKUP_PATH/db_backup_$TIMESTAMP.sql
            
            # Backup application files
            tar -czf $BACKUP_PATH/app_backup_$TIMESTAMP.tar.gz -C $PROJECT_PATH .
            
            echo "✅ Backup completed: $TIMESTAMP"
            
          elif [ "${{ github.event.inputs.action }}" == "rollback" ]; then
            echo "🔄 Rolling back to previous version..."
            cd $PROJECT_PATH
            
            # Get previous commit
            git log --oneline -2
            PREVIOUS_COMMIT=$(git log --format="%H" -n 2 | tail -1)
            
            # Rollback to previous commit
            git reset --hard $PREVIOUS_COMMIT
            
            # Restart containers
            docker compose down
            docker compose up -d --build
            
            echo "✅ Rollback completed!"
          fi