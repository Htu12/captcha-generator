name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (optional – chỉ để xem log)
        uses: actions/checkout@v4

      - name: View code in repository
        run: ls -la

      # Dùng SSH action để chạy lệnh từ xa (không phải SCP)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          # Nếu server chưa có Docker/Docker Compose v2, hãy cài trước.
          script: |
            set -euo pipefail

            PROJECT_PATH="/home/${{ secrets.SERVER_USER }}/${{ secrets.PROJECT_NAME }}"
            REPO_SSH="git@github.com:Htu12/captcha-generator.git"

            # Tạo thư mục nếu chưa tồn tại
            if [ ! -d "$PROJECT_PATH" ]; then
              mkdir -p "$PROJECT_PATH"
            fi

            # Clone lần đầu nếu chưa có .git
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              echo "Cloning repository via SSH..."
              git clone "$REPO_SSH" "$PROJECT_PATH"
            fi

            # Cập nhật code về main mới nhất
            cd "$PROJECT_PATH"
            git fetch --all --prune
            git checkout -f main
            git reset --hard origin/main
            git clean -fdx

            # Optional: dọn Docker rác
            echo "Cleaning up Docker resources..."
            docker system prune -f || true
            docker volume prune -f || true

            # Recreate stack
            docker compose down || true
            docker compose up -d --build

            # Health check nhẹ
            sleep 10
            docker ps
