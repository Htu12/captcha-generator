name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (optional – chỉ để xem log)
        uses: actions/checkout@v4

      - name: View code in repository
        run: ls -la

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            # Kiểm tra daemon
            sudo systemctl status docker --no-pager || sudo systemctl start docker

            PROJECT_PATH="/home/${{ secrets.SERVER_USER }}/${{ secrets.PROJECT_NAME }}"
            REPO_SSH="git@github.com:Htu12/captcha-generator.git"

            mkdir -p "$PROJECT_PATH"
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              # seed known_hosts cho github
              mkdir -p ~/.ssh && chmod 700 ~/.ssh
              ssh-keygen -R github.com >/dev/null 2>&1 || true
              ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
              chmod 600 ~/.ssh/known_hosts
              git clone "$REPO_SSH" "$PROJECT_PATH"
            fi

            cd "$PROJECT_PATH"
            git fetch --all --prune
            git checkout -f main
            git reset --hard origin/main
            git clean -fdx

            # Dọn tài nguyên + deploy bằng sudo
            sudo docker system prune -f || true
            sudo docker volume prune -f || true

            # docker compose v2
            sudo docker compose down || true
            sudo docker compose up -d --build

            sleep 10
            sudo docker ps
