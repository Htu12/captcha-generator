name: Deploy to CentOS Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Environment File
      run: |
        cat > .env << 'EOF'
        NODE_ENV=prod
        IS_AVAILABLE=1
        PORT_DEV=3000
        PORT_PROD=3000
        ALLOW_SEARCH_TIME="${{ secrets.ALLOW_SEARCH_TIME }}"
        CAPTCHA_LEVEL_DEV=medium
        CAPTCHA_LEVEL_PROD=easy
        CAPTCHA_SECRET=${{ secrets.CAPTCHA_SECRET }}
        BASE_URL_PROD=${{ secrets.BASE_URL_PROD }}
        BASE_URL_DEV=http://127.0.0.1:3000
        CORS_ORIGIN_DEV=http://127.0.0.1:3000
        CORS_ORIGIN_PROD=${{ secrets.CORS_ORIGIN_PROD }}
        DB_SERVER_DEV=localhost
        DB_PORT_DEV=5432
        DB_NAME_DEV=learn_postgres
        DB_USER_DEV=huutu12
        DB_PASSWORD_DEV=123456
        DB_SERVER_PROD=db
        DB_PORT_PROD=5432
        DB_NAME_PROD=${{ secrets.DB_NAME_PROD }}
        DB_USER_PROD=${{ secrets.DB_USER_PROD }}
        DB_PASSWORD_PROD=${{ secrets.DB_PASSWORD_PROD }}
        EOF

    - name: Deploy to CentOS Server (User: htu12)
      uses: appleboy/ssh-action@v1.0.3
      env:
        ALLOW_SEARCH_TIME: ${{ secrets.ALLOW_SEARCH_TIME }}
        CAPTCHA_SECRET: ${{ secrets.CAPTCHA_SECRET }}
        BASE_URL_PROD: ${{ secrets.BASE_URL_PROD }}
        CORS_ORIGIN_PROD: ${{ secrets.CORS_ORIGIN_PROD }}
        DB_NAME_PROD: ${{ secrets.DB_NAME_PROD }}
        DB_USER_PROD: ${{ secrets.DB_USER_PROD }}
        DB_PASSWORD_PROD: ${{ secrets.DB_PASSWORD_PROD }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: htu12
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        envs: ALLOW_SEARCH_TIME,CAPTCHA_SECRET,BASE_URL_PROD,CORS_ORIGIN_PROD,DB_NAME_PROD,DB_USER_PROD,DB_PASSWORD_PROD
        script: |
          echo "🚀 Starting deployment on CentOS for user htu12..."
          
          # Set project path for user htu12
          PROJECT_PATH="/home/htu12/captcha-generator"
          BACKUP_PATH="/home/htu12/backups"
          
          # Create directories if not exist
          mkdir -p $PROJECT_PATH
          mkdir -p $BACKUP_PATH
          
          # Fix Docker permissions for user htu12
          echo "🔧 Setting up Docker permissions..."
          if ! groups htu12 | grep -q docker; then
            echo "Adding htu12 to docker group..."
            sudo usermod -aG docker htu12
          fi
          
          # Reload group membership without logout
          newgrp docker << DOCKERCMDS || true
          echo "Docker group membership updated"
          DOCKERCMDS
          
          # Alternative: Change docker socket permissions temporarily
          sudo chmod 666 /var/run/docker.sock || true
          
          # Restart Docker service to ensure clean state
          if ! systemctl is-active --quiet docker; then
            echo "🔧 Starting Docker service..."
            sudo systemctl start docker
            sleep 5
          else
            echo "🔄 Restarting Docker service..."
            sudo systemctl restart docker
            sleep 10
          fi
          
          # Backup current deployment
          if [ -d "$PROJECT_PATH/.git" ]; then
            echo "💾 Creating backup..."
            BACKUP_NAME="backup-$(date +%Y%m%d_%H%M%S)"
            cp -r $PROJECT_PATH $BACKUP_PATH/$BACKUP_NAME
          fi
          
          # Clone repository if not exists
          if [ ! -d "$PROJECT_PATH/.git" ]; then
            echo "📥 Cloning repository..."
            git clone https://github.com/Htu12/captcha-generator.git $PROJECT_PATH
          else
            # Navigate to project directory
            cd $PROJECT_PATH
            
            # Pull latest changes
            echo "📦 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main
            git clean -fd
          fi
          
          # Navigate to project directory
          cd $PROJECT_PATH
          
          # Create .env file with environment variables
          echo "⚙️ Creating environment file..."
          cat > .env << ENVEOF
          NODE_ENV=prod
          IS_AVAILABLE=1
          PORT_DEV=3000
          PORT_PROD=3000
          ALLOW_SEARCH_TIME="$ALLOW_SEARCH_TIME"
          CAPTCHA_LEVEL_DEV=medium
          CAPTCHA_LEVEL_PROD=easy
          CAPTCHA_SECRET=$CAPTCHA_SECRET
          BASE_URL_PROD=$BASE_URL_PROD
          BASE_URL_DEV=http://127.0.0.1:3000
          CORS_ORIGIN_DEV=http://127.0.0.1:3000
          CORS_ORIGIN_PROD=$CORS_ORIGIN_PROD
          DB_SERVER_DEV=localhost
          DB_PORT_DEV=5432
          DB_NAME_DEV=learn_postgres
          DB_USER_DEV=huutu12
          DB_PASSWORD_DEV=123456
          DB_SERVER_PROD=db
          DB_PORT_PROD=5432
          DB_NAME_PROD=$DB_NAME_PROD
          DB_USER_PROD=$DB_USER_PROD
          DB_PASSWORD_PROD=$DB_PASSWORD_PROD
          ENVEOF
          
          # Stop existing containers (with sudo if needed)
          echo "🛑 Stopping existing containers..."
          if docker-compose down 2>/dev/null; then
            echo "Stopped with docker-compose"
          elif docker compose down 2>/dev/null; then
            echo "Stopped with docker compose"
          elif sudo docker-compose down 2>/dev/null; then
            echo "Stopped with sudo docker-compose"
          elif sudo docker compose down 2>/dev/null; then
            echo "Stopped with sudo docker compose"
          else
            echo "No containers to stop or docker not accessible"
          fi
          
          # Clean up Docker system
          echo "🧹 Cleaning up Docker resources..."
          if docker system prune -f 2>/dev/null; then
            echo "Cleaned with docker"
          elif sudo docker system prune -f 2>/dev/null; then
            echo "Cleaned with sudo docker"
          fi
          
          # Build and start new containers
          echo "🔨 Building and starting containers..."
          if docker-compose up -d --build --force-recreate 2>/dev/null; then
            echo "Started with docker-compose"
          elif docker compose up -d --build --force-recreate 2>/dev/null; then
            echo "Started with docker compose"
          elif sudo docker-compose up -d --build --force-recreate 2>/dev/null; then
            echo "Started with sudo docker-compose"
          elif sudo docker compose up -d --build --force-recreate 2>/dev/null; then
            echo "Started with sudo docker compose"
          else
            echo "❌ Failed to start containers"
            exit 1
          fi
          
          # Wait for containers to be ready
          echo "⏳ Waiting for containers to start..."
          sleep 30
          
          # Check container status
          echo "📊 Container status:"
          if docker ps 2>/dev/null; then
            echo "Docker accessible without sudo"
          elif sudo docker ps 2>/dev/null; then
            echo "Docker accessible with sudo"
          else
            echo "Cannot access Docker"
          fi
          
          # Show Docker logs for debugging
          echo "📋 Recent container logs:"
          if docker-compose logs --tail=20 2>/dev/null; then
            echo "Logs from docker-compose"
          elif docker compose logs --tail=20 2>/dev/null; then
            echo "Logs from docker compose"
          elif sudo docker-compose logs --tail=20 2>/dev/null; then
            echo "Logs from sudo docker-compose"
          elif sudo docker compose logs --tail=20 2>/dev/null; then
            echo "Logs from sudo docker compose"
          fi
          
          # Health check
          echo "🔍 Health check..."
          sleep 10
          
          if curl -f http://localhost:80 > /dev/null 2>&1; then
            echo "✅ Application is responding on port 80"
          elif curl -f http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Application is responding on port 3000"
          else
            echo "⚠️ Application might not be fully ready yet"
          fi
          
          echo "🎉 Deployment completed for user htu12 on CentOS!"

    - name: Notify Deployment Status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
          exit 1
        fi
